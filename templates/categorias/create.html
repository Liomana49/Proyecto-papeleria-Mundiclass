<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Categoría - Inventario y Ventas API</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <nav class="navbar">
        <a href="/">Inicio</a>
        <div class="dropdown">
            <button class="dropbtn">Categorías</button>
            <div class="dropdown-content">
                <a href="read.html">Ver Categorías</a>
                <a href="create.html">Crear Categoría</a>
                <a href="update.html">Actualizar Categoría</a>
                <a href="delete.html">Eliminar Categoría</a>
            </div>
        </div>
        <div class="dropdown">
            <button class="dropbtn">Productos</button>
            <div class="dropdown-content">
                <a href="../productos/read.html">Ver Productos</a>
                <a href="../productos/create.html">Crear Producto</a>
                <a href="../productos/update.html">Actualizar Producto</a>
                <a href="../productos/delete.html">Eliminar Producto</a>
            </div>
        </div>
        <div class="dropdown">
            <button class="dropbtn">Clientes</button>
            <div class="dropdown-content">
                <a href="../clientes/read.html">Ver Clientes</a>
                <a href="../clientes/create.html">Crear Cliente</a>
                <a href="../clientes/update.html">Actualizar Cliente</a>
                <a href="../clientes/delete.html">Eliminar Cliente</a>
            </div>
        </div>
        <div class="dropdown">
            <button class="dropbtn">Ventas</button>
            <div class="dropdown-content">
                <a href="../ventas/read.html">Ver Ventas</a>
                <a href="../ventas/create.html">Crear Venta</a>
            </div>
        </div>
        <a href="/historial.html">Historial</a>
        <a href="/planning.html">Planificación</a>
        <a href="/informacion_del_proyecto.html">Información del Proyecto</a>
    </nav>

    <div class="container">
        <h1>Crear Categoría</h1>

        <div class="form-section">
            <form id="create-categoria-form">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" required />

                <label for="codigo">Código:</label>
                <input type="text" id="codigo" name="codigo" />

                <label for="imagen">Imagen:</label>
                <input type="file" id="imagen" name="imagen" accept="image/*" />

                <button type="submit">Crear Categoría</button>
            </form>
        </div>

        <div id="message"></div>
    </div>

    <script>
        document.getElementById('create-categoria-form').addEventListener('submit', async function(event) {
            event.preventDefault();

            const formData = new FormData(this);
            const messageDiv = document.getElementById('message');

            try {
                const response = await fetch('/categorias', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    const result = await response.json();
                    messageDiv.innerHTML = '<p style="color: green;">Categoría creada exitosamente: ' + result.nombre + '</p>';
                    this.reset();
                } else {
                    const error = await response.json();
                    messageDiv.innerHTML = '<p style="color: red;">Error: ' + error.detail + '</p>';
                }
            } catch (error) {
                messageDiv.innerHTML = '<p style="color: red;">Error de red: ' + error.message + '</p>';
            }
        });
    </script>
</body>
</html>
